        <h1>Entre em contato</h1>

        <section>
            <h2>Fale com a gente</h2>

            <p>Preencha o formulário abaixo para entrar em contato.</p>

            <form>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="EX: samuel silva" required > <br>


    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="adailteste11@gmail.com" required > <br>


<label for="assunto">Assunto:</label>
<input type="text" id="assunto" name="assunto" placeholder="********" required > <br>


<label for="categoria">Categoria:</label>
<select id="categoria" name="categoria">
    <option value="">Selecione uma categoria</option>
    <option value="duvida">Dúvida</option>
    <option value="sugestao">Sugestão</option>
    <option value="elogio">Elogio</option>
    <option value="outro">Outro</option>
</select>

<br>

<label for="comentario">Comentário:</label>
<br>
<textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>

<br>

<button type="submit">Enviar</button>

</form>

        </section>
